name: Continue merged dependency release

on:
  workflow_run:
    workflows: [CI, 'CI — e2e', CodeQL, Dependabot auto-merge, Refresh trusted Dependabot CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: dependency-main-dispatch
  queue: max
  cancel-in-progress: false

jobs:
  continue-main:
    if: >-
      (github.event.workflow_run.event == 'pull_request' ||
       github.event.workflow_run.path == '.github/workflows/dependabot-refresh.yml') &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Dispatch canonical main checks and gated release after a safe bot merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const source = context.payload.workflow_run;
            const repo = context.repo;
            const fullName = `${repo.owner}/${repo.repo}`;
            const canonical = new Set([
              '.github/workflows/ci.yml', '.github/workflows/ci-e2e.yml',
              '.github/workflows/codeql.yml', '.github/workflows/dependabot-auto-merge.yml',
            ]);
            const pause = ms => new Promise(resolve => setTimeout(resolve, ms));
            const skip = message => core.info(`No dependency release dispatch: ${message}`);
            const mainRef = async () => (await github.rest.git.getRef({ ...repo, ref: 'heads/main' })).data.object.sha;
            
            // Embedded inline in the write-capable bridge. This file is a local build source,
            // never fetched from a PR or executed as a downloaded artifact at runtime.
            const controllerPath = '.github/workflows/dependabot-refresh.yml';
            const expectedRuntimeHash = 'be83ef0495ac8317a48a32faa085c860cece29038582b0c42308a882a63b8e07';
            const hash = value => require('node:crypto').createHash('sha256').update(value).digest('hex');
            function canonicalJSON(value) {
              const sorted = item => Array.isArray(item) ? item.map(sorted) : item && typeof item === 'object'
                ? Object.fromEntries(Object.keys(item).sort().map(key => [key, sorted(item[key])])) : item;
              // Match Python json.dumps(sort_keys=True,separators=(',',':'),ensure_ascii=True).
              return JSON.stringify(sorted(value)).replace(/[\u007f-\uffff]/g, char => `\\u${char.charCodeAt(0).toString(16).padStart(4, '0')}`);
            }
            const isSHA = value => typeof value === 'string' && /^[a-f0-9]{40}$/.test(value);
            const prove = (condition, message) => { if (!condition) throw new Error(`Controller release proof: ${message}`); };
            const controllerEvent = run => ['push', 'schedule', 'workflow_dispatch', 'workflow_run'].includes(run.event) &&
              run.head_branch === 'main' && run.head_repository?.full_name === fullName &&
              run.path === controllerPath && run.status === 'completed' && run.conclusion === 'success' &&
              ['github-actions[bot]', 'dependabot[bot]', repo.owner].includes(run.actor?.login) && isSHA(run.head_sha) &&
              Number.isSafeInteger(run.id) && Number.isSafeInteger(run.workflow_id);
            
            async function controllerMergedPR() {
              if (!controllerEvent(source)) return undefined;
              const registered = (await github.rest.actions.getWorkflow({ ...repo, workflow_id: 'dependabot-refresh.yml' })).data;
              prove(registered.path === controllerPath && registered.state === 'active' && registered.id === source.workflow_id,
                'source is not the registered active controller.');
              const actual = (await github.rest.actions.getWorkflowRun({ ...repo, run_id: source.id })).data;
              prove(actual.id === source.id && actual.workflow_id === registered.id && actual.head_sha === source.head_sha &&
                controllerEvent(actual), 'controller run identity/source changed.');
              const currentMain = await mainRef();
              async function ancestor(base, tip = source.head_sha) {
                prove(isSHA(base) && isSHA(tip), 'invalid recorded ancestry SHA.');
                const comparison = (await github.rest.repos.compareCommitsWithBasehead({ ...repo, basehead: `${base}...${tip}`, per_page: 100 })).data;
                prove(['ahead', 'identical'].includes(comparison.status), 'recorded commit is outside trusted main history.');
              }
              await ancestor(source.head_sha, currentMain);
              const jobs = (await github.rest.actions.listJobsForWorkflowRun({ ...repo, run_id: source.id, filter: 'latest', per_page: 100 })).data;
              prove(jobs.total_count <= 100, 'controller job pagination exceeded.');
              const matchingJobs = jobs.jobs.filter(job => job.run_id === source.id && job.name === 'refresh' &&
                job.head_sha === source.head_sha && job.status === 'completed' && job.conclusion === 'success');
              prove(matchingJobs.length === 1, 'expected one successful metadata controller job.');
              const downloaded = await github.rest.actions.downloadJobLogsForWorkflowRun({ ...repo, job_id: matchingJobs[0].id });
              const logs = typeof downloaded.data === 'string' ? downloaded.data : Buffer.from(downloaded.data).toString('utf8');
              prove(Buffer.byteLength(logs, 'utf8') <= 4 * 1024 * 1024, 'controller log bound exceeded.');
              const outcomes = [];
              for (const line of logs.split(/\r?\n/)) {
                const start = line.indexOf('{');
                if (start < 0) continue;
                try {
                  const record = JSON.parse(line.slice(start));
                  if (record.stage === 'merged' && isSHA(record.head) && record.merge_sha === currentMain) outcomes.push(record);
                } catch { /* Shell source echoes and informational text are not outcomes. */ }
              }
              const unique = [...new Map(outcomes.map(record => [`${record.head}:${record.merge_sha}`, record])).values()];
              if (!unique.length) return undefined; // Successful inspections often have nothing to merge.
              prove(unique.length === 1, 'ambiguous merged outcomes.');
              const outcome = unique[0];
              const contents = (await github.rest.repos.getContent({ ...repo, path: controllerPath, ref: source.head_sha })).data;
              prove(!Array.isArray(contents) && contents.type === 'file' && contents.encoding === 'base64', 'controller source is not a file.');
              const definition = Buffer.from(contents.content, 'base64').toString('utf8');
              const normalized = definition.replace(/\r\n/g, '\n');
              const runtimeMarker = '\n        run: |\n';
              const runtimeStart = normalized.indexOf(runtimeMarker);
              prove(runtimeStart >= 0 && normalized.indexOf(runtimeMarker, runtimeStart + 1) < 0,
                'controller source has no unique inline runtime.');
              const runtime = normalized.slice(runtimeStart + runtimeMarker.length).split('\n')
                .map(line => line.startsWith('          ') ? line.slice(10) : line).join('\n');
              prove(hash(runtime) === expectedRuntimeHash, 'controller runtime is not the reviewed implementation.');
              const policyBlocks = [...normalized.matchAll(/^ {6}REFRESH_POLICY_JSON: >-\n((?: {8}[^\n]*(?:\n|$))+)/gm)];
              prove(policyBlocks.length === 1, 'controller source has no unique reviewed JSON policy block.');
              const policy = JSON.parse(policyBlocks[0][1].replace(/^ {8}/gm, '').trim());
              prove(policy.repository === fullName && policy.default_branch === 'main' && policy.enabled === true &&
                policy.native_run_approval_authorized === true && policy.controller_path === controllerPath &&
                policy.ci_continuation === 'native_run_approval', 'source policy is not activated for this repository.');
              const policyFingerprint = hash(canonicalJSON(policy));
              const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...repo, commit_sha: outcome.head, per_page: 100,
              });
              const candidates = [];
              for (const item of associated) {
                const pull = (await github.rest.pulls.get({ ...repo, pull_number: item.number })).data;
                if (pull.user?.login === 'dependabot[bot]' && pull.user?.type === 'Bot' && pull.merged === true &&
                    pull.base?.ref === 'main' && pull.base?.repo?.full_name === fullName && pull.head?.repo?.full_name === fullName &&
                    pull.head?.sha === outcome.head && pull.merge_commit_sha === currentMain && pull.merged_by?.login === 'github-actions[bot]') candidates.push(pull);
              }
              prove(candidates.length === 1, 'no unique exact-head Dependabot merge by the bot.');
              const pull = candidates[0];
              const comments = await github.paginate(github.rest.issues.listComments, { ...repo, issue_number: pull.number, per_page: 100 });
              const journals = [];
              const marker = '<!-- dependabot-controlled-refresh-v1\n';
              for (const comment of comments) {
                if (comment.user?.login !== 'github-actions[bot]' || !comment.body?.startsWith(marker) || !comment.body.endsWith('\n-->')) continue;
                let record;
                try { record = JSON.parse(comment.body.slice(marker.length, -4)); } catch { continue; }
                if (record.repository !== fullName || record.pr !== pull.number || record.head !== outcome.head ||
                    record.controller_run_id !== source.id || record.controller_sha !== source.head_sha ||
                    record.policy_sha256 !== policyFingerprint) continue;
                const fingerprint = hash(canonicalJSON(record));
                if (logs.split(/\r?\n/).some(line => line.endsWith(`CONTROLLED_REFRESH_RECORD ${fingerprint}`))) journals.push(record);
              }
              prove(journals.length === 1, 'journal lacks the exact digest in this trusted controller run.');
              const journal = journals[0];
              prove(journal.captured_auto_actor === 'github-actions[bot]' && journal.disable_requested === true &&
                journal.auto_disabled === true && !journal.pending_update, 'missing captured queue-disable/finished-update provenance.');
              prove(Array.isArray(journal.bot_commits) && journal.bot_commits.length > 0 && journal.bot_commits.length <= 100 &&
                journal.bot_commits.every(isSHA) && journal.bot_commits.at(-1) === journal.root_bot_head, 'invalid original signed bot chain.');
              await ancestor(journal.original_base);
              const original = (await github.rest.repos.compareCommitsWithBasehead({ ...repo,
                basehead: `${journal.original_base}...${journal.root_bot_head}`, per_page: 100 })).data;
              prove(original.total_commits === journal.bot_commits.length &&
                JSON.stringify(original.commits.map(commit => commit.sha)) === JSON.stringify(journal.bot_commits), 'original human/extra commits were omitted.');
              for (const sha of journal.bot_commits) {
                const commit = (await github.rest.repos.getCommit({ ...repo, ref: sha })).data;
                prove(commit.sha === sha && commit.author?.login === 'dependabot[bot]' &&
                  ['dependabot[bot]', 'web-flow'].includes(commit.committer?.login) && commit.commit?.verification?.verified === true,
                  'original commit is not signed and bot-authored.');
                const types = [...commit.commit.message.matchAll(/^\s*update-type:\s*(\S+)\s*$/gm)].map(match => match[1]);
                prove(types.length > 0 && types.every(type => ['version-update:semver-patch', 'version-update:semver-minor'].includes(type)),
                  'Major or unclassified root dependency update.');
              }
              prove(Array.isArray(journal.merges) && journal.merges.length > 0 && journal.merges.length <= 8, 'invalid controlled merge count.');
              let tip = journal.root_bot_head;
              for (const merge of journal.merges) {
                prove(merge.old === tip && isSHA(merge.new), 'broken controlled merge lineage.');
                await ancestor(merge.base);
                const commit = (await github.rest.repos.getCommit({ ...repo, ref: merge.new })).data;
                prove(commit.sha === merge.new && commit.author?.login === 'github-actions[bot]' && commit.committer?.login === 'web-flow' &&
                  commit.commit?.verification?.verified === true && commit.parents?.length === 2 &&
                  commit.parents[0].sha === tip && commit.parents[1].sha === merge.base, 'human/unverified/wrong-parent controlled merge.');
                tip = merge.new;
              }
              prove(tip === outcome.head, 'controlled tip differs from the merged dependency head.');
              const mergeCommit = (await github.rest.repos.getCommit({ ...repo, ref: currentMain })).data;
              prove(mergeCommit.sha === currentMain && mergeCommit.parents?.length === 1 &&
                mergeCommit.parents[0].sha === source.head_sha, 'result is not the controller exact-main squash merge.');
              prove(await mainRef() === currentMain, 'main advanced during controller proof.');
              return pull;
            }

            // workflow_run can hold a write token: inspect metadata only, never PR code or artifacts.
            let pr;
            let dependencyHead;
            const fromController = source?.path === controllerPath;
            if (fromController) {
              pr = await controllerMergedPR();
              if (!pr) return skip('controller completion has no verified current-main merge.');
              dependencyHead = pr.head.sha;
            } else {
              if (source?.event !== 'pull_request' || source.conclusion !== 'success' ||
                  source.head_repository?.full_name !== fullName || !canonical.has(source.path)) {
                return skip('the source is not a successful canonical same-repository PR workflow.');
              }
              const associated = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
                ...repo, commit_sha: source.head_sha, per_page: 100,
              });
              for (const candidate of associated) {
                const current = (await github.rest.pulls.get({ ...repo, pull_number: candidate.number })).data;
                if (current.user?.login === 'dependabot[bot]' && current.user?.type === 'Bot' &&
                    current.base?.ref === 'main' && current.base?.repo?.full_name === fullName &&
                    current.head?.repo?.full_name === fullName && current.head?.sha === source.head_sha &&
                    current.auto_merge?.enabled_by?.login === 'github-actions[bot]') {
                  if (pr) throw new Error('Ambiguous dependency pull request for this workflow commit.');
                  pr = current;
                }
              }
              if (!pr) return skip('no matching bot-approved dependency update.');
              dependencyHead = source.head_sha;
            }
            const request = { ...repo, pull_number: pr.number, per_page: 100 };
            const commits = await github.paginate(github.rest.pulls.listCommits, request);
            const updateTypes = commits.filter(commit => commit.author?.login === 'dependabot[bot]')
              .flatMap(commit => [...commit.commit.message.matchAll(/^\s*update-type:\s*(version-update:semver-[a-z]+)\s*$/gm)].map(match => match[1]));
            if (!updateTypes.length || updateTypes.some(type => !['version-update:semver-patch', 'version-update:semver-minor'].includes(type))) {
              return skip('Major or unclassified dependency update.');
            }
            const reviews = await github.paginate(github.rest.pulls.listReviews, request);
            const latestBotReview = reviews.filter(review => review.user?.login === 'github-actions[bot]' &&
              review.commit_id === pr.head.sha).sort((a, b) => (b.id || 0) - (a.id || 0))[0];
            if (latestBotReview?.state !== 'APPROVED') {
              return skip('the current dependency commit has no bot approval.');
            }
            // CI completion and native auto-merge are asynchronous. A later completion retries
            // this short metadata wait; a failed/unmerged dependency PR never deploys.
            for (let attempt = 0; !pr.merged && attempt < 12; attempt++) {
              if (pr.state !== 'open' || pr.head.sha !== dependencyHead || !pr.auto_merge) return skip('the PR changed or auto-merge was disabled.');
              await pause(10000);
              pr = (await github.rest.pulls.get(request)).data;
            }
            if (!pr.merged) return skip('native merge is still pending; another completion can retry.');
            if (pr.merged_by?.login !== 'github-actions[bot]' || pr.head.sha !== dependencyHead ||
                !/^[a-f0-9]{40}$/.test(pr.merge_commit_sha || '')) return skip('not a matching native bot merge.');
            const sha = pr.merge_commit_sha;
            if (await mainRef() !== sha) return skip('a newer main commit superseded this merge.');
            
            const registeredWorkflows = new Map();
            async function workflowIdentity(workflow) {
              if (!registeredWorkflows.has(workflow)) {
                const value = (await github.rest.actions.getWorkflow({ ...repo, workflow_id: workflow })).data;
                prove(value.path === `.github/workflows/${workflow}` && value.state === 'active', 'canonical workflow registration changed.');
                registeredWorkflows.set(workflow, value.id);
              }
              return registeredWorkflows.get(workflow);
            }
            function trusted(run, workflow, workflowId) {
              return run.workflow_id === workflowId && run.head_sha === sha && run.head_branch === 'main' &&
                run.head_repository?.full_name === fullName && run.path === `.github/workflows/${workflow}` &&
                (run.event === 'push' || (run.event === 'workflow_dispatch' &&
                  ['github-actions[bot]', repo.owner].includes(run.actor?.login)));
            }
            async function latest(workflow) {
              const workflowId = await workflowIdentity(workflow);
              const response = await github.rest.actions.listWorkflowRuns({
                ...repo, workflow_id: workflow, head_sha: sha, branch: 'main', per_page: 100,
              });
              return response.data.workflow_runs.filter(run => trusted(run, workflow, workflowId)).sort((a, b) => b.id - a.id)[0];
            }
            async function dispatchUnlessPresent(workflow) {
              if (await mainRef() !== sha) throw new Error('Main advanced before workflow dispatch.');
              if (await latest(workflow)) return;
              await github.rest.actions.createWorkflowDispatch({ ...repo, workflow_id: workflow, ref: 'main' });
              if (await mainRef() !== sha) throw new Error('Main advanced during workflow dispatch.');
              core.info(`Dispatched ${workflow} for main ${sha}.`);
            }
            // Repository-wide serialization covers both PR and controller completions. Duplicate events
            // reuse existing canonical runs, including failures, rather than hiding them.
            for (const workflow of ['ci.yml', 'ci-e2e.yml']) await dispatchUnlessPresent(workflow);
            let passed = false;
            for (let attempt = 0; attempt < 75; attempt++) {
              if (await mainRef() !== sha) return skip('main advanced while CI was running.');
              const runs = await Promise.all(['ci.yml', 'ci-e2e.yml'].map(latest));
              for (const run of runs) {
                if (run?.status === 'completed' && run.conclusion !== 'success') {
                  throw new Error(`Canonical main CI did not succeed: ${run.path} (${run.conclusion}).`);
                }
              }
              if (runs.every(run => run?.status === 'completed' && run.conclusion === 'success')) { passed = true; break; }
              if (attempt + 1 < 75) await pause(20000);
            }
            if (!passed) throw new Error('Canonical main CI did not finish successfully within the release wait window.');
            // These existing workflows independently recheck require-ci.cjs before accessing
            // deployment credentials. No production deployment code runs in this bridge.
            for (const workflow of ['fly-deploy.yml', 'cloudflare-deploy.yml']) await dispatchUnlessPresent(workflow);
            core.info(`Canonical CI passed and gated release workflows are queued for ${sha}.`);
