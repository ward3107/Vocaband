# CI — Playwright end-to-end suite.
#
# Separate from ci.yml because:
#   - The browser run is slower than the typecheck/tests/build gate
#   - We want PR feedback in <2 min from ci.yml; e2e runs in parallel
#     and reports its own status check
#   - When e2e is flaky on a network hiccup we don't want to block
#     the typecheck / unit gate
#
# Scope: the FULL public suite (99 tests across Desktop Chrome + Pixel 7 +
# Galaxy S9+) plus the authenticated suite (44 tests) in a parallel job.
#
# Both jobs run INSIDE the official Playwright container image, which ships
# the browsers AND their OS-level libraries (libnss3, etc.) pre-installed.
# This replaces the old `npx playwright install --with-deps` /
# `install-deps` steps, whose apt-get calls periodically hung for ~20 min
# on a slow Azure package mirror and tripped the job timeout (see the
# cancelled "Playwright auth suite" runs after the #1338 Playwright bump).
# With the container there is no apt step to hang on.
#
# Resolve the browser image from the lockfile in an earlier job. Dependabot
# updates then use the matching driver and preinstalled browser image.

name: CI — e2e

# Least-privilege — read code + write artifacts on failure.  CodeQL
# flags missing top-level permissions; this is the recommended fix.
permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  browser-image:
    name: Resolve Playwright image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Read the locked Playwright version
        id: image
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const version = lock.packages?.['node_modules/@playwright/test']?.version;
          if (!/^\d+\.\d+\.\d+$/.test(version || '')) {
            throw new Error('Expected an exact stable Playwright version in package-lock.json');
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'image=mcr.microsoft.com/playwright:v' + version + '-noble\n');
          NODE
  e2e:
    needs: browser-image
    # NOTE: the display name is deliberately left as "Playwright smoke"
    # even though this job now runs the full public suite. Status checks
    # are keyed by job name, so renaming it would make any branch-protection
    # rule that requires "Playwright smoke" wait forever on a check that no
    # longer reports. Rename here only together with the branch-protection
    # setting on main.
    name: Playwright smoke
    runs-on: ubuntu-latest
    # Browsers + OS deps are baked into the image, so this covers npm ci +
    # a full-suite run only. The public suite is ~99 tests over 3 viewports
    # and finishes in ~2 min.
    timeout-minutes: 20
    container:
      image: ${{ needs.browser-image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Full public suite — every spec, every viewport. Includes the
      # "does it boot" smoke gate and the auth-flow security-regression
      # gate (docs/security-audit-framework/01-AUTH-IDENTITY.md), plus
      # the navigation / public-pages / url-routing / slow-network specs.
      # No browser-install step: the container already carries them.
      - name: Run Playwright public suite
        run: npx playwright test --config e2e/playwright.config.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── Authenticated suite ────────────────────────────────────────────────
  # Separate job so it runs in PARALLEL with the public suite (each ~2 min)
  # instead of serially, and so a failure points straight at which surface
  # broke. Uses playwright.auth.config.ts, whose build points
  # VITE_SUPABASE_URL at the Supabase mock so the seeded teacher/student
  # sessions restore. These specs cover the logged-in shells (dashboards,
  # deep links, back-button traps).
  e2e-auth:
    needs: browser-image
    name: Playwright auth suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.browser-image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Playwright auth suite
        run: npx playwright test --config e2e/playwright.auth.config.ts

      - name: Preserve teacher and student design screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unified-design-visuals
          path: e2e/test-results/design/
          retention-days: 14

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-auth
          path: playwright-report/
          retention-days: 14

  quick-play-board:
    needs: browser-image
    name: Quick Play projector + WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: ${{ needs.browser-image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Test real board at projector and mobile sizes
        run: npx playwright test --config e2e/playwright.board.config.ts
      - name: Preserve board screenshots and traces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quick-play-board-visuals
          path: e2e/test-results/quick-play-board/
          retention-days: 14

  browser-test-gate:
    name: Browser test gate
    if: ${{ always() }}
    needs: [browser-image, e2e, e2e-auth, quick-play-board]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every browser job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" != "success,success,success,success" ]]; then
            echo "Browser prerequisites or tests did not all succeed: $RESULTS"
            exit 1
          fi
