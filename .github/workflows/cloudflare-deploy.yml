# Cloudflare Workers deploy — triggered on every push to main.
#
# This Actions deployment waits for CI and browser checks. Configure the native
# Cloudflare Git integration separately so it cannot bypass this gate.
#
# Required GitHub secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — token with "Edit Cloudflare Workers" permission
#                            Create at: https://dash.cloudflare.com/profile/api-tokens
#                            Template: "Edit Cloudflare Workers"
#   CLOUDFLARE_ACCOUNT_ID  — your account ID (df686d8a898f1c25a378952aa4c99350
#                            for this project, per `accounts_list`)
#                            Find at: https://dash.cloudflare.com → right sidebar
#                            → "Account ID" (starts with a long hex string)
#
# Once both secrets are added, every push to main will:
#   1. install deps
#   2. run vitest (gate: tests must pass)
#   3. run vite build (produces dist/ with the SPA + the Worker bundle)
#   4. run wrangler deploy (reads wrangler.jsonc at the repo root)
#   5. Cloudflare Workers is updated ~30s after push

name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  # Serialize production deployments without interrupting a running release.
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Require successful CI and browser tests on this main commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const requireCI = require('./.github/scripts/require-ci.cjs');
            await requireCI({ github, context, core });

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Match package.json `engines.node: >=22.0.0` (wrangler 4.x,
          # miniflare 4.x and @cloudflare/kv-asset-handler 0.5 all
          # require Node 22+).  Node 20 worked locally but blew up here
          # with EBADENGINE warnings on every package.
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build (vite + @cloudflare/vite-plugin)
        # VITE_CLOUDFLARE_URL is read at build time by src/utils/audioUrl.ts.
        # When set, every word-audio fetch goes to the R2-backed CDN instead
        # of Supabase Storage (cheaper egress + lower latency for IL users).
        # The R2 bucket `vocaband-audio` is already populated (mirrored via
        # scripts/mirror-supabase-to-r2.ts) and exposed at audio.vocaband.com
        # — see docs/operator-tasks.md §6 for the connect-domain step.
        env:
          VITE_CLOUDFLARE_URL: https://audio.vocaband.com
        run: npm run build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # vite.config.ts intentionally disables @cloudflare/vite-plugin
          # (it caused dev-server white screens), so the build doesn't
          # emit a dist/vocaband/wrangler.json — point wrangler at the
          # source config at the repo root, which has assets.directory
          # set to ./dist (populated by `npm run build`).
          command: deploy --config wrangler.jsonc
