name: Complete class entry database release

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/release-class-entry-migration*.mjs
      - scripts/class-entry-approved-schema.json
      - .github/workflows/class-entry-database-release.yml
  push:
    branches: [main]
    paths:
      - scripts/release-class-entry-migration*.mjs
      - scripts/class-entry-approved-schema.json
      - .github/workflows/class-entry-database-release.yml
  workflow_dispatch:
    inputs:
      mode:
        description: Check or apply the already-approved class entry migration
        type: choice
        options: [check, apply]
        default: check

permissions:
  contents: read

jobs:
  test:
    name: Class entry release safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/release-class-entry-migration.test.mjs

  release:
    name: Apply and verify approved class entry migration
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    concurrency:
      group: supabase-migrations-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Use existing Management API authorization and verify the result
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          CLASS_ENTRY_RELEASE_MODE: ${{ github.event_name == 'push' && 'apply' || inputs.mode || 'check' }}
        run: node scripts/release-class-entry-migration.mjs
