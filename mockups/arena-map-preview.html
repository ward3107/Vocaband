<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
  body { background:#eef2ff; padding:24px; display:flex; gap:28px; align-items:flex-start; }
  .label { font-weight:900; color:#3730a3; font-size:13px; text-transform:uppercase; letter-spacing:.08em; margin-bottom:8px; text-align:center; }

  /* viewport box */
  .viewport { position:relative; overflow:hidden; border-radius:22px;
    border:1px solid rgba(125,211,252,.6); box-shadow:0 10px 25px rgba(56,189,248,.25); }

  .world { position:absolute; inset:0; transform-origin:0 0; }

  /* word pill */
  .pill { position:absolute; transform:translate(-50%,-50%); z-index:10;
    display:flex; align-items:center; gap:4px; padding:9px 15px; border-radius:999px;
    font-weight:900; font-size:17px; white-space:nowrap; color:#fff;
    background:linear-gradient(90deg,#fbbf24,#f97316); box-shadow:0 3px 8px rgba(245,158,11,.3);
    box-shadow:0 3px 8px rgba(245,158,11,.3), 0 0 0 2px rgba(255,255,255,.7); }
  .pill.locked { background:rgba(168,162,158,.8); opacity:.7; }
  .pill.answered { background:#d1fae5; color:#059669; opacity:.5; }

  /* avatar */
  .avatar { position:absolute; left:0; top:0; z-index:20; display:flex; flex-direction:column; align-items:center; transform:translate(-50%,-50%); }
  .avatar .medallion { display:flex; align-items:center; justify-content:center; width:42px; height:42px;
    border-radius:999px; background:rgba(255,255,255,.6); border:1px solid rgba(255,255,255,.8);
    box-shadow:0 3px 8px rgba(0,0,0,.12); font-size:24px; backdrop-filter:blur(4px); }
  .avatar.self .medallion { background:rgba(255,255,255,.85); border:2px solid #e879f9; box-shadow:0 3px 10px rgba(217,70,239,.35); }
  .avatar .name { margin-top:2px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,.75);
    font-size:10px; font-weight:900; color:#57534e; white-space:nowrap; max-width:80px; overflow:hidden; text-overflow:ellipsis; }

  /* edge arrow */
  .arrow { position:absolute; left:0; top:0; z-index:30; display:flex; flex-direction:column; align-items:center; transform:translate(-50%,-50%); }
  .arrow .badge { display:flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:999px;
    background:#fbbf24; color:#fff; box-shadow:0 3px 8px rgba(245,158,11,.4), 0 0 0 2px rgba(255,255,255,.8); }
  .arrow .alabel { margin-top:2px; padding:1px 6px; border-radius:999px; background:rgba(255,255,255,.85);
    font-size:9px; font-weight:900; color:#b45309; white-space:nowrap; max-width:64px; overflow:hidden; text-overflow:ellipsis; }

  /* HUD chips (student) */
  .hud { position:absolute; top:10px; left:10px; right:10px; z-index:40; display:flex; justify-content:space-between; }
  .chip { display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:999px;
    background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.12); font-weight:900; font-size:12px; }
  .chip.indigo { color:#4f46e5; } .chip.stone { color:#44403c; }

  /* joystick (student) */
  .stick { position:absolute; bottom:18px; right:18px; z-index:40; width:104px; height:104px; border-radius:999px;
    background:rgba(255,255,255,.4); border:2px solid rgba(255,255,255,.6); box-shadow:0 8px 20px rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center; backdrop-filter:blur(4px); }
  .stick .knob { width:46px; height:46px; border-radius:999px; background:linear-gradient(135deg,#6366f1,#7c3aed);
    border:2px solid rgba(255,255,255,.7); box-shadow:0 3px 8px rgba(99,102,241,.4); }
</style>
</head>
<body>
  <div>
    <div class="label">Student — follow camera (phone)</div>
    <div id="student" class="viewport" style="width:300px;height:600px;"></div>
  </div>
  <div>
    <div class="label">Teacher projector — whole map</div>
    <div id="host" class="viewport" style="width:760px;height:532px;"></div>
  </div>

<script>
const WORLD_W = 1000, WORLD_H = 700, ZOOM = 1.85, MARGIN = 26, GRAB_R = 60;

// Stylized world-map SVG — same shapes as WorldMapBackground in ArenaCanvas.tsx
const MAP_SVG = `
<svg style="position:absolute;inset:0;width:100%;height:100%" viewBox="0 0 1000 700" preserveAspectRatio="none" aria-hidden="true">
  <defs>
    <linearGradient id="ocean" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#bae6fd"/><stop offset="55%" stop-color="#7dd3fc"/><stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86efac"/><stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1000" height="700" fill="url(#ocean)"/>
  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5">
    <line x1="140" y1="0" x2="140" y2="700"/><line x1="280" y1="0" x2="280" y2="700"/><line x1="420" y1="0" x2="420" y2="700"/>
    <line x1="560" y1="0" x2="560" y2="700"/><line x1="700" y1="0" x2="700" y2="700"/><line x1="840" y1="0" x2="840" y2="700"/>
    <line x1="0" y1="117" x2="1000" y2="117"/><line x1="0" y1="234" x2="1000" y2="234"/><line x1="0" y1="351" x2="1000" y2="351"/>
    <line x1="0" y1="468" x2="1000" y2="468"/><line x1="0" y1="585" x2="1000" y2="585"/>
  </g>
  <g stroke="#fde68a" stroke-opacity="0.6" stroke-width="6" fill="url(#land)">
    <path d="M150 70 C 230 60, 250 150, 210 210 C 260 250, 230 360, 170 400 C 120 440, 90 520, 130 600 C 70 590, 60 470, 95 400 C 60 330, 80 220, 130 180 C 110 130, 110 90, 150 70 Z"/>
    <path d="M520 80 C 640 50, 800 70, 900 120 C 940 160, 900 210, 820 220 C 740 250, 640 230, 560 250 C 500 250, 470 190, 500 140 C 490 110, 500 90, 520 80 Z"/>
    <path d="M560 300 C 640 290, 700 330, 690 410 C 680 490, 620 560, 560 560 C 520 520, 510 440, 530 380 C 530 340, 540 310, 560 300 Z"/>
    <path d="M810 470 C 880 460, 930 500, 915 555 C 880 590, 800 585, 770 545 C 760 505, 780 480, 810 470 Z"/>
  </g>
</svg>`;

const navIcon = (deg) => `<svg width="14" height="14" viewBox="0 0 24 24" fill="#fff" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${deg}deg)"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg>`;

// Scenario: words + players in world coords
const WORDS = [
  { id:'a', label:'mountain', x:520, y:350, state:'available' },
  { id:'b', label:'river',    x:300, y:250, state:'available' },
  { id:'c', label:'forest',   x:650, y:430, state:'available' },
  { id:'d', label:'ocean',    x:160, y:540, state:'locked' },
  { id:'e', label:'island',   x:860, y:150, state:'available' },
  { id:'f', label:'valley',   x:470, y:130, state:'answered' },
];
const PLAYERS = [
  { id:'me',  name:'You',  emoji:'🦊', x:520, y:350, self:true },
  { id:'p2',  name:'Maya', emoji:'🐼', x:600, y:300 },
  { id:'p3',  name:'Omar', emoji:'🐯', x:470, y:420 },
  { id:'p4',  name:'Lia',  emoji:'🐸', x:300, y:250 },
  { id:'p5',  name:'Dan',  emoji:'🐧', x:760, y:545 },
  { id:'p6',  name:'Noa',  emoji:'🦉', x:200, y:120 },
];

function render(elId, opts) {
  const el = document.getElementById(elId);
  const W = el.clientWidth, H = el.clientHeight;
  const sx = W / WORLD_W, sy = H / WORLD_H;
  const camera = opts.camera;
  const zoom = camera ? ZOOM : 1;

  const world = document.createElement('div');
  world.className = 'world';
  world.innerHTML = MAP_SVG;

  // grab-radius halo around self (so the camera view shows the catch zone)
  if (camera) {
    const self = PLAYERS.find(p=>p.self);
    const halo = document.createElement('div');
    halo.style.cssText = `position:absolute;z-index:5;border-radius:999px;border:2px dashed rgba(255,255,255,.7);background:rgba(255,255,255,.12);width:${GRAB_R*2*sx}px;height:${GRAB_R*2*sy}px;left:${self.x*sx}px;top:${self.y*sy}px;transform:translate(-50%,-50%)`;
    world.appendChild(halo);
  }

  for (const w of WORDS) {
    const d = document.createElement('div');
    d.className = 'pill ' + w.state;
    d.style.left = (w.x*sx) + 'px';
    d.style.top  = (w.y*sy) + 'px';
    d.textContent = (w.state==='locked'?'🔒 ':w.state==='answered'?'✓ ':'') + w.label;
    world.appendChild(d);
  }
  for (const p of PLAYERS) {
    const d = document.createElement('div');
    d.className = 'avatar' + (p.self?' self':'');
    d.style.transform = `translate3d(${p.x*sx}px,${p.y*sy}px,0) translate(-50%,-50%)`;
    d.innerHTML = `<div class="medallion">${p.emoji}</div><div class="name">${p.name}</div>`;
    world.appendChild(d);
  }

  // camera transform
  let tx=0, ty=0;
  if (camera) {
    const self = PLAYERS.find(p=>p.self);
    const ssx = self.x*sx, ssy = self.y*sy;
    tx = Math.max(W - zoom*W, Math.min(0, W/2 - zoom*ssx));
    ty = Math.max(H - zoom*H, Math.min(0, H/2 - zoom*ssy));
    world.style.transform = `translate3d(${tx}px,${ty}px,0) scale(${zoom})`;
  }
  el.appendChild(world);

  // edge arrows (student only) — mirror the RAF math
  if (camera) {
    const cx=W/2, cy=H/2, hx=W/2-MARGIN, hy=H/2-MARGIN;
    for (const w of WORDS.filter(w=>w.state==='available')) {
      const scrX = tx + zoom*(w.x*sx), scrY = ty + zoom*(w.y*sy);
      const onScreen = scrX>=MARGIN&&scrX<=W-MARGIN&&scrY>=MARGIN&&scrY<=H-MARGIN;
      if (onScreen) continue;
      const dx=scrX-cx, dy=scrY-cy, ang=Math.atan2(dy,dx);
      const s=Math.min(hx/(Math.abs(dx)||1e-3), hy/(Math.abs(dy)||1e-3));
      const ex=cx+dx*s, ey=cy+dy*s;
      const a=document.createElement('div');
      a.className='arrow';
      a.style.transform=`translate3d(${ex}px,${ey}px,0) translate(-50%,-50%)`;
      a.innerHTML=`<div class="badge">${navIcon(ang*180/Math.PI+90)}</div><div class="alabel">${w.label}</div>`;
      el.appendChild(a);
    }
    // HUD + joystick
    const hud=document.createElement('div'); hud.className='hud';
    hud.innerHTML=`<span class="chip indigo">🏟️ Word Hunt</span><span class="chip stone">👑 #1 · 120 pts</span>`;
    el.appendChild(hud);
    const stick=document.createElement('div'); stick.className='stick';
    stick.innerHTML='<div class="knob"></div>'; el.appendChild(stick);
  }
}

render('student', { camera:true });
render('host', { camera:false });
</script>
</body>
</html>
