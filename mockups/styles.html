<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,"Segoe UI",system-ui,sans-serif}
  body{background:#e7ecf5;padding:24px;display:flex;gap:26px;align-items:flex-start}
  .col{display:flex;flex-direction:column;align-items:center;gap:9px;width:280px}
  .label{font-weight:900;font-size:13px;letter-spacing:.04em;color:#1e293b}
  .tag{font-size:11px;font-weight:800;color:#64748b;text-align:center;line-height:1.4}
  .phone{width:280px;height:540px;border-radius:28px;overflow:hidden;border:6px solid #1e293b;box-shadow:0 14px 36px rgba(0,0,0,.25);position:relative}
  svg{display:block}
</style></head>
<body>

<!-- ============ A — Bright Adventure ============ -->
<div class="col">
  <div class="label">A · Bright Adventure</div>
  <div class="phone">
    <svg width="280" height="540" viewBox="0 0 280 540">
      <defs>
        <linearGradient id="aOcean" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcf6"/><stop offset="1" stop-color="#46b3e6"/></linearGradient>
        <linearGradient id="aLand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a7e8a0"/><stop offset="1" stop-color="#6bce72"/></linearGradient>
        <filter id="aSoft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.2" flood-opacity=".2"/></filter>
      </defs>
      <rect width="280" height="540" fill="url(#aOcean)"/>
      <path d="M30 120 C120 90,180 150,170 230 C200 320,150 410,90 430 C20 420,40 320,20 250 C5 190,10 150,30 120Z" fill="#f3e0b0"/>
      <path d="M40 130 C120 104,170 158,160 232 C188 316,146 398,96 416 C36 404,52 316,34 250 C20 196,24 158,40 130Z" fill="url(#aLand)"/>
      <ellipse cx="80" cy="200" rx="34" ry="28" fill="#3f9e57"/>
      <ellipse cx="110" cy="340" rx="40" ry="30" fill="#3f9e57"/>
      <g transform="translate(95,270)"><path d="M-26 22 L-8 -16 L6 10 L24 -22 L42 22Z" fill="#9aa3ad"/><path d="M-8 -16 L0 2 L6 10Z" fill="#eef2f6"/></g>
      <ellipse cx="210" cy="430" rx="48" ry="34" fill="#f3e0b0"/><ellipse cx="210" cy="430" rx="38" ry="26" fill="url(#aLand)"/>
      <!-- word labels: clean white chip + amber dot -->
      <g font-weight="800" font-family="system-ui">
        <g transform="translate(86,196)"><rect x="-42" y="-15" width="84" height="30" rx="15" fill="#fff" filter="url(#aSoft)"/><circle cx="-29" cy="0" r="5" fill="#f59e0b"/><text x="5" y="5" text-anchor="middle" font-size="16" fill="#1f2937">river</text></g>
        <g transform="translate(210,430)"><rect x="-40" y="-15" width="80" height="30" rx="15" fill="#fff" filter="url(#aSoft)"/><circle cx="-27" cy="0" r="5" fill="#f59e0b"/><text x="6" y="5" text-anchor="middle" font-size="16" fill="#1f2937">island</text></g>
      </g>
      <g transform="translate(150,260)"><circle r="21" fill="#fff" stroke="#e879f9" stroke-width="4" filter="url(#aSoft)"/><text y="8" text-anchor="middle" font-size="24">🦊</text></g>
      <g transform="translate(120,180)"><circle r="16" fill="#fff" opacity=".92" filter="url(#aSoft)"/><text y="6" text-anchor="middle" font-size="18">🐼</text></g>
    </svg>
  </div>
  <div class="tag">Bright cartoon world · white map-pin labels (today's style, refined)</div>
</div>

<!-- ============ B — Treasure Map ============ -->
<div class="col">
  <div class="label">B · Treasure Map</div>
  <div class="phone">
    <svg width="280" height="540" viewBox="0 0 280 540">
      <defs>
        <linearGradient id="bParch" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3e6c4"/><stop offset="1" stop-color="#e6d2a3"/></linearGradient>
        <filter id="bSoft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.8" flood-opacity=".25"/></filter>
      </defs>
      <rect width="280" height="540" fill="url(#bParch)"/>
      <!-- faint aged blotches -->
      <g fill="#c9b08a" opacity=".15"><circle cx="60" cy="80" r="40"/><circle cx="230" cy="470" r="50"/></g>
      <!-- landmasses: tan with ink double coastline -->
      <g>
        <path d="M40 150 C130 120,180 180,165 260 C195 350,140 430,80 440 C20 425,45 330,28 270 C12 210,18 175,40 150Z" fill="#d8b878" stroke="#7a5a2e" stroke-width="3"/>
        <path d="M40 150 C130 120,180 180,165 260 C195 350,140 430,80 440 C20 425,45 330,28 270 C12 210,18 175,40 150Z" fill="none" stroke="#7a5a2e" stroke-width="1" stroke-dasharray="2 4" transform="translate(0,0) scale(1.0)" opacity=".0"/>
        <ellipse cx="215" cy="120" rx="40" ry="30" fill="#d8b878" stroke="#7a5a2e" stroke-width="3"/>
      </g>
      <!-- mountains as ink carets -->
      <g stroke="#7a5a2e" stroke-width="2.5" fill="none"><path d="M70 250 l12 -16 l10 12 l12 -18 l12 22"/></g>
      <!-- dotted travel route -->
      <path d="M150 280 C 120 200, 200 160, 215 120" stroke="#a3431b" stroke-width="2.5" stroke-dasharray="2 7" fill="none" stroke-linecap="round"/>
      <!-- X marks the spot -->
      <g stroke="#a3431b" stroke-width="4" stroke-linecap="round"><line x1="208" y1="113" x2="222" y2="127"/><line x1="222" y1="113" x2="208" y2="127"/></g>
      <!-- compass rose -->
      <g transform="translate(238,470)" opacity=".85"><circle r="22" fill="none" stroke="#7a5a2e" stroke-width="2"/><path d="M0 -20 L5 0 L0 20 L-5 0Z" fill="#a3431b"/><path d="M-20 0 L0 -5 L20 0 L0 5Z" fill="#7a5a2e"/><text y="-24" text-anchor="middle" font-size="9" font-weight="900" fill="#7a5a2e">N</text></g>
      <!-- word labels: wooden signpost -->
      <g font-family="Georgia, serif" font-weight="700">
        <g transform="translate(95,210)"><rect x="-1.5" y="0" width="3" height="18" fill="#7a5a2e"/><rect x="-42" y="-16" width="84" height="22" rx="4" fill="#b07d3e" stroke="#7a5a2e" stroke-width="2" filter="url(#bSoft)"/><text x="0" y="0" text-anchor="middle" font-size="14" fill="#fdf3dd" dy="-1">river</text></g>
        <g transform="translate(215,150)"><rect x="-1.5" y="0" width="3" height="16" fill="#7a5a2e"/><rect x="-40" y="-16" width="80" height="22" rx="4" fill="#b07d3e" stroke="#7a5a2e" stroke-width="2" filter="url(#bSoft)"/><text x="0" y="0" text-anchor="middle" font-size="14" fill="#fdf3dd" dy="-1">island</text></g>
      </g>
      <g transform="translate(150,290)"><circle r="20" fill="#fdf3dd" stroke="#a3431b" stroke-width="4" filter="url(#bSoft)"/><text y="8" text-anchor="middle" font-size="23">🦊</text></g>
      <g transform="translate(110,360)"><circle r="15" fill="#fdf3dd" stroke="#7a5a2e" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="17">🐼</text></g>
    </svg>
  </div>
  <div class="tag">Pirate parchment · compass, X-marks, routes · wooden signpost labels</div>
</div>

<!-- ============ C — Tropical Islands ============ -->
<div class="col">
  <div class="label">C · Tropical Islands</div>
  <div class="phone">
    <svg width="280" height="540" viewBox="0 0 280 540">
      <defs>
        <linearGradient id="cSea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5fe0d6"/><stop offset="1" stop-color="#23b6c9"/></linearGradient>
        <filter id="cSoft" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="1.5" stdDeviation="2.4" flood-opacity=".22"/></filter>
      </defs>
      <rect width="280" height="540" fill="url(#cSea)"/>
      <!-- islands: shallow ring + sand + greenery -->
      <g>
        <g transform="translate(95,210)"><ellipse rx="74" ry="60" fill="#9defe6" opacity=".7"/><ellipse rx="56" ry="44" fill="#f6e3a8"/><ellipse rx="40" ry="30" fill="#74cf7a"/><text x="-30" y="-6" font-size="20">🌴</text><text x="10" y="6" font-size="18">🌴</text></g>
        <g transform="translate(205,410)"><ellipse rx="62" ry="50" fill="#9defe6" opacity=".7"/><ellipse rx="46" ry="36" fill="#f6e3a8"/><ellipse rx="30" ry="22" fill="#74cf7a"/><text x="-16" y="2" font-size="18">🌴</text></g>
      </g>
      <!-- word labels: teardrop location pin + small label -->
      <g font-weight="800" font-family="system-ui">
        <g transform="translate(95,196)">
          <path d="M0 0 C-9 -14,-9 -24,0 -24 C9 -24,9 -14,0 0Z" transform="translate(0,2)" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
          <circle cx="0" cy="-15" r="4" fill="#fff"/>
          <g transform="translate(0,12)"><rect x="-34" y="-11" width="68" height="22" rx="11" fill="#fff" filter="url(#cSoft)"/><text y="5" text-anchor="middle" font-size="14" fill="#0f766e">river</text></g>
        </g>
        <g transform="translate(205,396)">
          <path d="M0 0 C-9 -14,-9 -24,0 -24 C9 -24,9 -14,0 0Z" transform="translate(0,2)" fill="#ef4444" stroke="#fff" stroke-width="1.5"/>
          <circle cx="0" cy="-15" r="4" fill="#fff"/>
          <g transform="translate(0,12)"><rect x="-36" y="-11" width="72" height="22" rx="11" fill="#fff" filter="url(#cSoft)"/><text y="5" text-anchor="middle" font-size="14" fill="#0f766e">island</text></g>
        </g>
      </g>
      <g transform="translate(150,270)"><circle r="21" fill="#fff" stroke="#e879f9" stroke-width="4" filter="url(#cSoft)"/><text y="8" text-anchor="middle" font-size="24">🦊</text></g>
      <g transform="translate(118,250)"><circle r="16" fill="#fff" opacity=".92" filter="url(#cSoft)"/><text y="6" text-anchor="middle" font-size="18">🐼</text></g>
    </svg>
  </div>
  <div class="tag">Turquoise lagoon · sandy islands + palms · teardrop location-pin labels</div>
</div>

</body></html>
