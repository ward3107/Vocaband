<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui,sans-serif}
  body{background:#eef2f8;padding:28px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .label{font-weight:900;color:#1e293b;font-size:15px}
  .sub{font-size:11px;color:#64748b;font-weight:700}
  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:20px;background:#fff;border-radius:22px;padding:26px;box-shadow:0 10px 26px rgba(0,0,0,.1)}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px}
  .av{width:88px;height:88px;border-radius:999px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.13);border:3px solid #fff}
  .nm{font-size:11px;font-weight:800;color:#475569}
</style></head>
<body>
<div class="label">סט דמויות מאוירות · SVG בתוך האפליקציה (הצעה)</div>
<div class="sub">סגנון אחיד · אותו מראה בכל מכשיר · קל להוסיף עוד</div>
<div class="grid" id="g"></div>

<script>
function cell(name,bg1,bg2,inner){return `<div class="cell"><div class="av" style="background:linear-gradient(135deg,${bg1},${bg2})"><svg width="66" height="66" viewBox="0 0 100 100">${inner}</svg></div><div class="nm">${name}</div></div>`;}
const eyes=(a,b,cy,r=7)=>`<circle cx="${a}" cy="${cy}" r="${r}" fill="#2b2b3a"/><circle cx="${b}" cy="${cy}" r="${r}" fill="#2b2b3a"/><circle cx="${a-2}" cy="${cy-2}" r="2.4" fill="#fff"/><circle cx="${b-2}" cy="${cy-2}" r="2.4" fill="#fff"/>`;
const ch=(a,b,cy)=>`<circle cx="${a}" cy="${cy}" r="6" fill="#ff9bb0" opacity=".65"/><circle cx="${b}" cy="${cy}" r="6" fill="#ff9bb0" opacity=".65"/>`;

const fox=`<path d="M22 34 L30 16 L44 30 Z" fill="#e8743b"/><path d="M78 34 L70 16 L56 30 Z" fill="#e8743b"/><circle cx="50" cy="52" r="30" fill="#f08a4b"/><ellipse cx="50" cy="64" rx="17" ry="14" fill="#fdf3ea"/>${eyes(40,60,50)}${ch(33,67,62)}<ellipse cx="50" cy="66" rx="4" ry="3" fill="#2b2b3a"/>`;
const cat=`<path d="M24 30 L30 14 L44 28 Z" fill="#8b93a3"/><path d="M76 30 L70 14 L56 28 Z" fill="#8b93a3"/><circle cx="50" cy="54" r="30" fill="#9aa2b1"/>${eyes(40,60,50)}${ch(33,67,62)}<path d="M50 60 l-4 5 l4 3 l4 -3 Z" fill="#2b2b3a"/><g stroke="#fff" stroke-width="1.6" opacity=".8"><line x1="30" y1="62" x2="18" y2="60"/><line x1="70" y1="62" x2="82" y2="60"/></g>`;
const frog=`<circle cx="34" cy="34" r="13" fill="#6fc96b"/><circle cx="66" cy="34" r="13" fill="#6fc96b"/><circle cx="34" cy="34" r="7" fill="#fff"/><circle cx="66" cy="34" r="7" fill="#fff"/><circle cx="34" cy="35" r="3.4" fill="#2b2b3a"/><circle cx="66" cy="35" r="3.4" fill="#2b2b3a"/><circle cx="50" cy="58" r="28" fill="#7ad675"/><path d="M34 60 q16 18 32 0" stroke="#2b6b33" stroke-width="4" fill="none" stroke-linecap="round"/>${ch(32,68,60)}`;
const robot=`<rect x="46" y="6" width="8" height="14" rx="3" fill="#9fb3c8"/><circle cx="50" cy="6" r="5" fill="#ffd24d"/><rect x="22" y="24" width="56" height="52" rx="16" fill="#cfe0f2"/><rect x="30" y="34" width="40" height="26" rx="10" fill="#243b53"/><circle cx="40" cy="47" r="6" fill="#5be0ff"/><circle cx="60" cy="47" r="6" fill="#5be0ff"/><rect x="40" y="64" width="20" height="5" rx="2.5" fill="#9fb3c8"/>`;
const alien=`<path d="M50 16 C 74 16, 82 44, 74 64 C 68 82, 32 82, 26 64 C 18 44, 26 16, 50 16 Z" fill="#b07cf0"/><line x1="38" y1="20" x2="32" y2="8" stroke="#b07cf0" stroke-width="4" stroke-linecap="round"/><line x1="62" y1="20" x2="68" y2="8" stroke="#b07cf0" stroke-width="4" stroke-linecap="round"/><circle cx="32" cy="8" r="4" fill="#ffd24d"/><circle cx="68" cy="8" r="4" fill="#ffd24d"/><ellipse cx="40" cy="50" rx="8" ry="11" fill="#1b1b2e"/><ellipse cx="60" cy="50" rx="8" ry="11" fill="#1b1b2e"/><circle cx="38" cy="46" r="2.6" fill="#fff"/><circle cx="58" cy="46" r="2.6" fill="#fff"/>`;
const dragon=`<path d="M34 22 L30 10 L42 18 Z" fill="#39b39b"/><path d="M66 22 L70 10 L58 18 Z" fill="#39b39b"/><circle cx="50" cy="52" r="30" fill="#46c9af"/><ellipse cx="50" cy="64" rx="16" ry="12" fill="#bff0e6"/>${eyes(40,60,48)}${ch(32,68,60)}<ellipse cx="44" cy="64" rx="2.4" ry="3" fill="#2b6b5e"/><ellipse cx="56" cy="64" rx="2.4" ry="3" fill="#2b6b5e"/>`;
const bear=`<circle cx="28" cy="30" r="12" fill="#a9743f"/><circle cx="72" cy="30" r="12" fill="#a9743f"/><circle cx="28" cy="30" r="6" fill="#c89b6e"/><circle cx="72" cy="30" r="6" fill="#c89b6e"/><circle cx="50" cy="54" r="30" fill="#b9824c"/><ellipse cx="50" cy="64" rx="15" ry="12" fill="#e9d2b0"/>${eyes(40,50,48,6)}<ellipse cx="50" cy="60" rx="4" ry="3" fill="#2b2b3a"/>${ch(33,67,62)}`;
const panda=`<circle cx="28" cy="28" r="12" fill="#2b2b3a"/><circle cx="72" cy="28" r="12" fill="#2b2b3a"/><circle cx="50" cy="54" r="30" fill="#fff"/><ellipse cx="38" cy="50" rx="8" ry="11" fill="#2b2b3a"/><ellipse cx="62" cy="50" rx="8" ry="11" fill="#2b2b3a"/><circle cx="38" cy="50" r="4" fill="#fff"/><circle cx="62" cy="50" r="4" fill="#fff"/><ellipse cx="50" cy="64" rx="4" ry="3" fill="#2b2b3a"/>`;
const bunny=`<ellipse cx="38" cy="20" rx="8" ry="18" fill="#f3e6ee"/><ellipse cx="62" cy="20" rx="8" ry="18" fill="#f3e6ee"/><ellipse cx="38" cy="22" rx="4" ry="12" fill="#ff9bb0"/><ellipse cx="62" cy="22" rx="4" ry="12" fill="#ff9bb0"/><circle cx="50" cy="56" r="28" fill="#fbf3f7"/>${eyes(40,60,52)}${ch(33,67,64)}<path d="M50 60 l-3 4 l3 2 l3 -2 Z" fill="#ff7a98"/><line x1="50" y1="66" x2="50" y2="72" stroke="#d98" stroke-width="1.5"/>`;
const penguin=`<ellipse cx="50" cy="54" rx="30" ry="32" fill="#2b3340"/><ellipse cx="50" cy="60" rx="18" ry="22" fill="#fff"/><circle cx="42" cy="44" r="6" fill="#fff"/><circle cx="58" cy="44" r="6" fill="#fff"/><circle cx="42" cy="45" r="3" fill="#2b2b3a"/><circle cx="58" cy="45" r="3" fill="#2b2b3a"/><path d="M50 50 l-6 6 l6 4 l6 -4 Z" fill="#ffb13b"/>`;
const dino=`<circle cx="50" cy="54" r="30" fill="#7ec850"/><path d="M36 26 l4 -10 l4 10 Z" fill="#5aa83a"/><path d="M50 24 l4 -11 l4 11 Z" fill="#5aa83a"/><path d="M64 26 l4 -10 l4 10 Z" fill="#5aa83a"/><ellipse cx="50" cy="62" rx="16" ry="12" fill="#b6e89a"/>${eyes(40,60,48)}<ellipse cx="45" cy="62" rx="2" ry="2.6" fill="#3a6b2a"/><ellipse cx="55" cy="62" rx="2" ry="2.6" fill="#3a6b2a"/>`;
const monster=`<path d="M22 52 C 22 26, 78 26, 78 52 C 80 78, 60 86, 50 86 C 40 86, 20 78, 22 52 Z" fill="#ff8a4c"/><path d="M30 30 l-4 -12 l10 8 Z" fill="#ff8a4c"/><path d="M70 30 l4 -12 l-10 8 Z" fill="#ff8a4c"/><circle cx="50" cy="46" r="14" fill="#fff"/><circle cx="50" cy="47" r="7" fill="#2b2b3a"/><circle cx="47" cy="44" r="2.6" fill="#fff"/><path d="M40 66 q10 10 20 0" fill="#7a2e0e"/><rect x="44" y="64" width="4" height="5" fill="#fff"/><rect x="52" y="64" width="4" height="5" fill="#fff"/>`;

const set=[
 ['Fox','#ffd9a8','#ffb36b',fox],['Cat','#dfe6f0','#b9c3d4',cat],['Frog','#c7f0c0','#9be090',frog],
 ['Robot','#d6e6fa','#aecbf0',robot],['Alien','#e8d2fb','#cba6f5',alien],['Dragon','#bff0e6','#86ddc9',dragon],
 ['Bear','#f0dcc0','#e0bd92',bear],['Panda','#eef1f5','#d7dde6',panda],['Bunny','#fbe6f0','#f3c9de',bunny],
 ['Penguin','#d3dbe6','#aab6c6',penguin],['Dino','#d6f0bf','#aadd86',dino],['Monster','#ffe0c2','#ffc093',monster],
];
document.getElementById('g').innerHTML=set.map(s=>cell(...s)).join('');
</script>
</body></html>
